workflows:
  ios-automatic-build:
    name: Erkiz Isci Takip iOS Cloud Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 20
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          npm install -g @capacitor/cli
          npm install
      - name: Add & Sync iOS
        script: |
          npx cap add ios || true
          npx cap copy ios
          npx cap sync ios
      - name: CocoaPods Install
        script: |
          cd ios/App
          pod install
      - name: Xcode Build
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
    artifacts:
      - ios/App/build/**/*.ipa
      - ios/App/build/**/*.app
