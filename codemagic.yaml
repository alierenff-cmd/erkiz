workflows:
  android-release:
    name: Erkiz Isci Takip Android Release
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Build signed APK and AAB
        script: |
          ./gradlew assembleRelease bundleRelease
    artifacts:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/bundle/release/*.aab

  ios-automatic-build:
    name: Erkiz Isci Takip iOS Cloud Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Create this App Store Connect API key integration in Codemagic
      # Team settings > Integrations > Developer Portal.
      app_store_connect: erkiz-app-store
    environment:
      node: 20
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.erkiz.iscitakip
    scripts:
      - name: Install dependencies
        script: |
          npm install -g @capacitor/cli
          npm install --no-audit --no-fund
      - name: Add & Sync iOS
        script: |
          npx cap add ios || true
          npx cap copy ios
          npx cap sync ios
          npx @capacitor/assets generate --ios --assetPath resources --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff'
      - name: CocoaPods Install
        script: |
          cd ios/App
          pod install --repo-update
      - name: Configure iOS signing
        script: |
          xcode-project use-profiles
          cd ios/App
          agvtool new-version -all 2
      - name: Archive signed iOS app
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive
      - name: Export signed IPA
        script: |
          cd ios/App
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist /Users/builder/export_options.plist \
            -exportPath build/export
    artifacts:
      - ios/App/build/export/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
