# Erkiz Isci Takip - Docker dagitimi
#
# GIZLI DEGERLER BU DOSYADA TUTULMAZ. Bu dosyanin yanina (proje kok dizini)
# bir ".env" dosyasi olusturun (.gitignore'da, git'e girmez). Ornek: docker-env.example
# Eksik degisken varsa "docker compose up" hata vererek durur.

services:
  app:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: erkiz-takip-app
    restart: always
    # Uygulama portu yalnizca sunucunun kendisine acik; disari Nginx (443) uzerinden cikilir.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=erkiz_app
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD tanimli degil}
      - DB_NAME=erkiz_takip
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET tanimli degil}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET tanimli degil}
      - TC_ENCRYPTION_KEY=${TC_ENCRYPTION_KEY:?TC_ENCRYPTION_KEY tanimli degil}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:?ADMIN_PASSWORD_HASH tanimli degil}
      - ADMIN_SECURITY_PIN=${ADMIN_SECURITY_PIN:?ADMIN_SECURITY_PIN tanimli degil}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - SAP_AL11_DIR=/var/data/sap_al11_export
    volumes:
      - sap_data:/var/data/sap_al11_export
      - ./server/logs:/usr/src/app/logs
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: erkiz-takip-mysql
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD tanimli degil}
      MYSQL_DATABASE: erkiz_takip
      MYSQL_USER: erkiz_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD tanimli degil}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # Sifre komut satirinda gorunmesin diye ortam degiskeninden okunur.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysqladmin ping -h localhost -u erkiz_app"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  sap_data:
