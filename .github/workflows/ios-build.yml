name: iOS Cloud Build & Sign

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    name: Build iOS IPA on Cloud macOS
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      COCOAPODS_DISABLE_STATS: "true"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install -g @capacitor/cli
          npm install --no-audit --no-fund

      - name: Build Web Assets & Add iOS Platform
        run: |
          npx cap add ios || true
          npx cap copy ios
          npx cap sync ios

      - name: Build iOS App Project
        run: |
          echo "Building iOS App Bundle via Xcodebuild on GitHub Cloud macOS..."
          cd ios/App
          pod install --no-repo-update || true
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -derivedDataPath build -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO build

      - name: Package IPA for Diawi
        run: |
          cd ios/App
          mkdir -p Payload
          APP_PATH=$(find build -name "App.app" -type d | head -n 1)
          echo "Found App.app at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -r ErkizIsci.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ErkizIsci-iOS-App
          path: ios/App/ErkizIsci.ipa

