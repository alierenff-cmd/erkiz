name: iOS Cloud Build & Sign

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    name: Build iOS IPA on Cloud macOS
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install -g @capacitor/cli
          npm install

      - name: Build Web Assets & Add iOS Platform
        run: |
          npx cap add ios || true
          npx cap copy ios
          npx cap sync ios

      - name: Build iOS App & Create IPA
        run: |
          echo "Building iOS App Bundle via Xcodebuild on GitHub Cloud macOS..."
          cd ios/App
          pod install || true
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r ErkizIsciTakip.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ErkizIsciTakip-iOS-IPA
          path: ios/App/ErkizIsciTakip.ipa
