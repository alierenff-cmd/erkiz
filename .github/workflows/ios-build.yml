name: iOS Cloud Build & Sign

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    name: Build iOS IPA on Cloud macOS
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install -g @capacitor/cli
          npm install

      - name: Build Web Assets & Add iOS Platform
        run: |
          npx cap add ios || true
          npx cap copy ios
          npx cap sync ios

      - name: Build iOS Workspace (Archive)
        run: |
          echo "Building iOS App Bundle via Xcodebuild on GitHub Cloud macOS..."
          cd ios/App
          pod install || true
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Erkiz-Isci-iOS-App
          path: ios/App/
