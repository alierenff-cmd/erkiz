# Erkiz İşçi Takip Sistemi - Nginx Yapılandırma Şablonu
# Bu dosyayı /etc/nginx/sites-available/erkiz-takip konumuna kopyalayıp domain bilginizi güncelleyin.

upstream erkiz_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# 1. HTTP -> HTTPS Yönlendirmesi (ve Let's Encrypt Doğrulama Alanı)
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN_OR_IP; # Örn: takip.erkizmuhendislik.com veya AWS Elastic IP

    # Certbot SSL doğrulaması için gerekli alan
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Tüm trafiği HTTPS'e yönlendir
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Güvenli Web & API Sunucusu
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN_OR_IP; # Örn: takip.erkizmuhendislik.com

    # SSL Sertifika Yolları (Certbot otomatik oluşturur)
    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN_OR_IP/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN_OR_IP/privkey.pem;

    # SSL Güvenlik Ayarları
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Güvenlik Başlıkları
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Yükleme Limiti (CSV ve Fotoğraf yüklemeleri için)
    client_max_body_size 20M;

    # Gzip Sıkıştırma (Mobil veri tasarrufu & hız için)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Node.js API ve Web Arayüzü Ters Proxy
    location / {
        proxy_pass http://erkiz_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Zaman aşımı limitleri
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
